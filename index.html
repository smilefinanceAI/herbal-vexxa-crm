
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d38">
  <title>Login | OrderDesk</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5fa;
      color: #17233d;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 15px 55px rgba(20,35,65,.09);
    }

    .logo {
      width: 52px;
      height: 52px;
      background: #172d56;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 9px;
    }

    .subtitle {
      color: #7b879c;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2ed;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #315fc0;
      box-shadow: 0 0 0 3px #315fc018;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 13px;
      border: none;
      background: none;
      color: #315fc0;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2458c6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -9px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #315fc0;
      cursor: pointer;
      background: none;
      border: none;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      padding: 11px;
      border-radius: 8px;
    }

    .error {
      background: #fff0f0;
      color: #bd3434;
    }

    .success {
      background: #eaf8ef;
      color: #207443;
    }

    .footer {
      text-align: center;
      margin-top: 27px;
      color: #929bad;
      font-size: 11px;
    }

    @media(max-width:480px) {
      .login-container {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="logo">OD</div>

  <h1>Welcome back</h1>

  <p class="subtitle">
    Login to your OrderDesk account
    to manage orders and deliveries.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>

    <div class="password-wrap">
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="show-password"
        id="togglePassword"
      >SHOW</button>
    </div>

    <button
      type="button"
      class="forgot"
      id="forgotPassword"
    >
      Forgot password?
    </button>

    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      Sign In
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="footer">
    OrderDesk Management System
    <br><br>
    Secure Login · Powered by Firebase
  </div>

</div>

<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    sendPasswordResetEmail,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


  // FIREBASE CONFIGURATION

  const firebaseConfig = {
    apiKey: "AIzaSyABPpxWsl3cgYmapfMKQt88gtaz9CoyMF4",
    authDomain: "smile-genius-39d10.firebaseapp.com",
    projectId: "smile-genius-39d10",
    storageBucket: "smile-genius-39d10.firebasestorage.app",
    messagingSenderId: "999120884444",
    appId: "1:999120884444:web:21dc6952c067811ee11a19",
    measurementId: "G-6C85C0JR7J"
  };


  // INITIALIZE FIREBASE

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);


  const loginForm = document.getElementById("loginForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const message = document.getElementById("message");


  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
  }


  function getFirebaseError(error) {

    const errors = {
      "auth/invalid-email": "Please enter a valid email.",
      "auth/user-not-found": "Account not found.",
      "auth/wrong-password": "Incorrect password.",
      "auth/invalid-credential": "Invalid email or password.",
      "auth/user-disabled": "This account has been disabled.",
      "auth/too-many-requests": "Too many attempts. Try again later.",
      "auth/network-request-failed": "Check your internet connection."
    };

    return errors[error.code] || error.message;
  }


  // ROLE BASED REDIRECTION

  async function redirectUser(user) {

    try {

      const token = await user.getIdTokenResult(true);

      const role = token.claims.role;

      if (role === "admin") {
        window.location.replace("admin.html");
        return;
      }

      if (role === "delivery") {
        window.location.replace("delivery.html");
        return;
      }

      await signOut(auth);

      showMessage(
        "Your account role is not configured. Please contact administrator."
      );

    } catch (error) {

      showMessage(getFirebaseError(error));

    }

  }


  // LOGIN

  loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    message.style.display = "none";

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";

    try {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const result = await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      await redirectUser(result.user);

    } catch (error) {

      showMessage(getFirebaseError(error));

    } finally {

      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";

    }

  });


  // SHOW / HIDE PASSWORD

  document.getElementById("togglePassword")
  .addEventListener("click", () => {

    const isPassword = passwordInput.type === "password";

    passwordInput.type = isPassword ? "text" : "password";

    document.getElementById("togglePassword").textContent =
      isPassword ? "HIDE" : "SHOW";

  });


  // FORGOT PASSWORD

  document.getElementById("forgotPassword")
  .addEventListener("click", async () => {

    const email = emailInput.value.trim();

    if (!email) {
      showMessage("Please enter your email address first.");
      emailInput.focus();
      return;
    }

    try {

      await sendPasswordResetEmail(auth, email);

      showMessage(
        "Password reset instructions have been sent if the account exists.",
        "success"
      );

    } catch (error) {

      showMessage(getFirebaseError(error));

    }

  });


  // CHECK EXISTING SESSION

  onAuthStateChanged(auth, async (user) => {

    if (user) {

      loginBtn.disabled = true;
      loginBtn.textContent = "Checking account...";

      await redirectUser(user);

      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";

    }

  });

</script>

</body>
</html>
